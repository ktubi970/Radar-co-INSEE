# Lancement : docker compose up --build
# L'app Streamlit est servie sur http://localhost:8501
# Le service `ollama` télécharge le modèle défini par OLLAMA_MODEL au démarrage.

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=qwen2.5:1.5b
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama serve &
        until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$$OLLAMA_MODEL";
        wait
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  ollama_data:
